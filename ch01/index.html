/* ---------- Unit 1 绘本舞台助手（u1_ 前缀避免全局冲突） ---------- */
function u1_bg(p, imgName, veil = 0.2) {
  mk('image', { href: `../img/${imgName}`, x: 0, y: 0, width: 1600, height: 900, preserveAspectRatio: 'xMidYMid slice' }, p);
  if (veil > 0) mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: `rgba(255,253,247,${veil})` }, p);
}

function u1_txt(p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 700 } = {}) {
  const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 });
  if (t0 !== null) show(e, t0, 0.35);
  return e;
}

function u1_badge(p, label, x = 80, y = 62, fill = '#ff5a5f', t0 = 0.1) {
  const g = G(p, { x, y, o: 0 });
  const w = Math.max(160, label.length * 25 + 54);
  mk('rect', { x: 4, y: -24, width: w, height: 52, rx: 26, fill: 'rgba(60,40,10,0.14)' }, g);
  mk('rect', { x: 0, y: -28, width: w, height: 52, rx: 26, fill }, g);
  T(g, label, { x: w / 2, y: 7, size: 24, fill: '#ffffff', weight: 700, anchor: 'middle' });
  tw(g, { o: 1 }, t0, 0.3);
  return g;
}

function u1_card(p, x, y, w, h, { fill = 'rgba(255,253,247,0.93)', stroke = '#f0dec0', sw = 4, rx = 28 } = {}) {
  const g = G(p, { x, y });
  mk('rect', { x: 6, y: 10, width: w, height: h, rx, fill: 'rgba(80,50,20,0.1)' }, g);
  mk('rect', { x: 0, y: 0, width: w, height: h, rx, fill, stroke, 'stroke-width': sw }, g);
  return g;
}

const U1_SFX_CACHE = {};
function u1_playSfx(name, vol = 0.6) {
  try {
    const a = U1_SFX_CACHE[name] || (U1_SFX_CACHE[name] = new Audio(`audio/sfx/${name}.mp3`));
    a.currentTime = 0;
    a.volume = vol * +($('volume')?.value ?? 1);
    a.play().catch(() => {});
  } catch {}
}

function u1_numBadge(txt, col) {
  const sp = h('span', 'sc-swatch');
  sp.style.background = col;
  sp.style.color = '#ffffff';
  sp.style.fontWeight = '800';
  sp.style.fontSize = '18px';
  sp.style.display = 'inline-flex';
  sp.style.alignItems = 'center';
  sp.style.justifyContent = 'center';
  sp.textContent = txt;
  return sp;
}

/* 创建可点双语部位卡 + 指向线 */
function u1_makeTag(p, spec, tAt) {
  const { x, y, zh, en, col, tx, ty } = spec;
  const line = mk('line', {
    x1: x + (tx > x ? 116 : -116), y1: y,
    x2: tx, y2: ty,
    stroke: col, 'stroke-width': 3.5, 'stroke-dasharray': '7 6', 'stroke-linecap': 'round',
  }, p);
  put(line, { o: 0 });
  const dot = mk('circle', { cx: tx, cy: ty, r: 7.5, fill: col, stroke: '#ffffff', 'stroke-width': 2.5 }, p);
  put(dot, { o: 0 });
  const g = G(p, { x, y, o: 0, s: 0.8 });
  mk('rect', { x: -116, y: -36, width: 232, height: 74, rx: 22, fill: 'rgba(60,40,10,0.1)' }, g);
  mk('rect', { x: -120, y: -39, width: 236, height: 74, rx: 22, fill: 'rgba(255,253,247,0.96)', stroke: col, 'stroke-width': 3.5 }, g);
  mk('circle', { cx: -92, cy: -2, r: 10, fill: col }, g);
  T(g, zh, { x: -72, y: -6, size: 26, fill: '#2b241d', weight: 700, anchor: 'start' });
  T(g, en, { x: -72, y: 21, size: 19, fill: '#665c50', weight: 600, anchor: 'start' });
  tw(g, { o: 1, s: 1 }, tAt, 0.35, back);
  tw(line, { o: 0.85 }, tAt, 0.3);
  tw(dot, { o: 1 }, tAt, 0.3);
  return { g, line, dot };
}

/* 刷牙物品纯 SVG 图标 */
function u1_drawBrushItem(par, kind) {
  if (kind === 'toothbrush') {
    mk('g', { transform: 'rotate(-28)' }, par);
    const w = par.lastChild;
    mk('path', { d: 'M-8,44 L-5,-36 C-5,-44 5,-44 5,-36 L8,44 C8,50 -8,50 -8,44 Z', fill: '#38bdf8', stroke: '#2b241d', 'stroke-width': 3 }, w);
    mk('rect', { x: 3, y: -38, width: 22, height: 22, rx: 5, fill: '#ffffff', stroke: '#2b241d', 'stroke-width': 2.6 }, w);
    mk('path', { d: 'M8,-32 H21 M8,-26 H21 M8,-20 H21', stroke: '#90e0ef', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, w);
  } else if (kind === 'toothpaste') {
    mk('g', { transform: 'rotate(-16)' }, par);
    const w = par.lastChild;
    mk('path', { d: 'M-18,-28 L18,-28 L13,34 L-13,34 Z', fill: '#ff7aa2', stroke: '#2b241d', 'stroke-width': 3, 'stroke-linejoin': 'round' }, w);
    mk('rect', { x: -20, y: -34, width: 40, height: 10, rx: 3, fill: '#ffffff', stroke: '#2b241d', 'stroke-width': 2.5 }, w);
    mk('rect', { x: -9, y: 34, width: 18, height: 14, rx: 4, fill: '#38bdf8', stroke: '#2b241d', 'stroke-width': 2.6 }, w);
    mk('path', { d: 'M-10,-4 H10 M-8,8 H8', stroke: '#ffffff', 'stroke-width': 4, 'stroke-linecap': 'round' }, w);
  } else if (kind === 'comb') {
    mk('g', { transform: 'rotate(-20)' }, par);
    const w = par.lastChild;
    mk('rect', { x: -34, y: -18, width: 68, height: 18, rx: 8, fill: '#ffd166', stroke: '#2b241d', 'stroke-width': 3 }, w);
    for (let cx = -28; cx <= 28; cx += 9) {
      mk('rect', { x: cx - 2, y: 0, width: 4, height: 24, rx: 2, fill: '#ffd166', stroke: '#2b241d', 'stroke-width': 2 }, w);
    }
  } else if (kind === 'soap') {
    mk('ellipse', { cx: 0, cy: 6, rx: 36, ry: 22, fill: '#a8e6cf', stroke: '#2b241d', 'stroke-width': 3 }, par);
    mk('ellipse', { cx: -10, cy: 0, rx: 14, ry: 6, transform: 'rotate(-18 -10 0)', fill: '#ffffff', opacity: 0.6 }, par);
    mk('circle', { cx: 22, cy: -16, r: 9, fill: '#e0fbfc', stroke: '#38bdf8', 'stroke-width': 2 }, par);
    mk('circle', { cx: 34, cy: -26, r: 5.5, fill: '#e0fbfc', stroke: '#38bdf8', 'stroke-width': 2 }, par);
  }
}

/* 眼睛能看到什么：小图标绘制 */
function u1_drawEyeConcept(par, kind) {
  if (kind === 'colours') {
    // 红苹果、黄星星、蓝气球
    mk('circle', { cx: -66, cy: 10, r: 28, fill: '#ff5a5f', stroke: '#2b241d', 'stroke-width': 2.8 }, par);
    mk('path', { d: 'M-66,-18 Q-62,-32 -52,-28', fill: 'none', stroke: '#4f772d', 'stroke-width': 4, 'stroke-linecap': 'round' }, par);
    mk('polygon', { points: '0,-24 9,-4 30,-4 13,9 19,29 0,17 -19,29 -13,9 -30,-4 -9,-4', fill: '#ffd60a', stroke: '#2b241d', 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, par);
    mk('ellipse', { cx: 66, cy: 2, rx: 24, ry: 29, fill: '#38bdf8', stroke: '#2b241d', 'stroke-width': 2.8 }, par);
    mk('path', { d: 'M66,31 Q62,48 70,56', fill: 'none', stroke: '#5a3b2c', 'stroke-width': 2.6 }, par);
  } else if (kind === 'sizes') {
    // 大球 vs 小球 + 大熊轮廓 vs 小熊轮廓
    mk('circle', { cx: -48, cy: 0, r: 40, fill: '#ff9f1c', stroke: '#2b241d', 'stroke-width': 3 }, par);
    mk('path', { d: 'M-72,-14 Q-48,-28 -24,-14', fill: 'none', stroke: '#ffffff', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.7 }, par);
    T(par, '大 big', { x: -48, y: 58, size: 19, fill: '#2b241d', weight: 700, anchor: 'middle' });
    mk('circle', { cx: 52, cy: 18, r: 20, fill: '#2ec4b6', stroke: '#2b241d', 'stroke-width': 3 }, par);
    T(par, '小 small', { x: 52, y: 58, size: 19, fill: '#2b241d', weight: 700, anchor: 'middle' });
  } else if (kind === 'shapes') {
    mk('circle', { cx: -64, cy: 6, r: 26, fill: '#ff70a6', stroke: '#2b241d', 'stroke-width': 2.8 }, par);
    mk('rect', { x: -24, y: -18, width: 48, height: 48, rx: 6, fill: '#8ac926', stroke: '#2b241d', 'stroke-width': 2.8 }, par);
    mk('polygon', { points: '66,-22 38,28 94,28', fill: '#3a86ff', stroke: '#2b241d', 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, par);
  }
}

            drag = { dx: p0[0] - st(g).x, dy: p0[1] - st(g).y, sx: p0[0], sy: p0[1], moved: false };
            L.append(g);
            g.setPointerCapture(e.pointerId);
          });
          g.addEventListener('pointermove', e => {
            if (!drag) return;
            const p0 = pt(e);
            if (Math.hypot(p0[0] - drag.sx, p0[1] - drag.sy) > 8) drag.moved = true;
            if (drag.moved) put(g, { x: p0[0] - drag.dx, y: p0[1] - drag.dy });
          });
          const endDrag = () => {
            if (!drag) return;
            const moved = drag.moved;
            drag = null;
            tryPlace(item, st(g).x, st(g).y, !moved);
          };
          g.addEventListener('pointerup', endDrag);
          g.addEventListener('lostpointercapture', endDrag);
          keyAct(g, () => tryPlace(item, def.home[0], def.home[1], true));
        });

        return {
          hint: [kbd('1–4'), ' 放置灯泡 · 或拖进红绿灯'],
          reveal() {
            nodes.filter(n => n.slot && !n.placed).forEach(snapBulb);
            return '红绿灯的三种颜色是红色、黄色和绿色！';
          },
          lock() { locked = true; nodes.forEach(n => { n.g.style.cursor = 'default'; }); },
          key(e) {
            const idx = +e.key - 1;
            if (idx >= 0 && idx < nodes.length) {
              const it = nodes[idx];
              tryPlace(it, it.home[0], it.home[1], true);
              return true;
            }
            return false;
          },
        };
      },
    }], done, '红绿灯挑战'),
  }],

  /* 7. 复习挑战：数一数我的身体（触摸选择数字星星填入卡片） */
  ['u1_count', '复习！数一数身体部位', (m, D) => {
    const p = panel(0);
    u1_bg(p, 'bg_u1_bedroom.jpg', 0.2);
    u1_badge(p, '复习挑战 · 数一数我的身体', 84, 60, '#9d4edd', 0.1);

    const expWrap = G(p, { x: 250, y: 525 });
    const exp = Doudou.create(expWrap, { x: 0, y: 0, s: 1.5, hat: false, scarf: false, barefoot: true, eyeColor: 'brown', expr: 'happy', armL: 28, armR: -28 });
    S.countDoudou = exp;

    const specs = [
      ['我有', '只手 · hands',    '2', '#ff5a5f', 'hand'],
      ['我有', '条腿 · legs',     '2', '#2d7dd2', 'leg'],
      ['我有', '张嘴 · mouth',    '1', '#f77f00', 'mouth'],
      ['我有', '只眼睛 · eyes',   '2', '#2bb673', 'eye'],
    ];

    S.countRows = [];
    specs.forEach(([preTxt, postTxt, ans, col], i) => {
      const cy = 155 + i * 168;
      const card = u1_card(p, 445, cy, 430, 140, { fill: 'rgba(255,253,247,0.95)', stroke: '#e8d8bd', sw: 3.5, rx: 24 });
      T(card, preTxt, { x: 36, y: 82, size: 34, fill: '#2b241d', weight: 700 });
      const box = mk('rect', { x: 118, y: 34, width: 72, height: 72, rx: 18, fill: '#f4f7fb', stroke: col, 'stroke-width': 3.5, 'stroke-dasharray': '7 5' }, card);
      const qMark = T(card, '?', { x: 154, y: 84, size: 38, fill: col, weight: 800, anchor: 'middle' });
      const ansText = T(card, ans, { x: 154, y: 86, size: 44, fill: '#ffffff', weight: 800, anchor: 'middle', o: 0 });
      T(card, postTxt, { x: 208, y: 82, size: 28, fill: '#2b241d', weight: 700 });
      S.countRows.push({ box, qMark, ansText, col });
      put(card, { o: 0, y: cy + 20 });
      tw(card, { o: 1, y: cy }, m('cnt_go', i * 0.3), 0.35, out);
    });

    clockRun(t => {
      Doudou.animateIdle(exp, t, { armL: 28, armR: -28 });
    }, D, { tail: true });
  }, {
    lead: false,
    hold: 1.5,
    ask: done => {
      const fillCount = (idx, partName) => {
        const r = S.countRows?.[idx];
        if (r) {
          r.box.setAttribute('fill', r.col);
          r.box.removeAttribute('stroke-dasharray');
          fx(r.qMark, { o: 0 }, 0, 0.18);
          fx(r.ansText, { o: 1 }, 0.05, 0.25, back);
          u1_playSfx('chime', 0.6);
        }
        if (S.countDoudou) {
          S.countDoudou.highlightPart(partName, true);
          setTimeout(() => S.countDoudou?.highlightPart(partName, false), 1100);
        }
      };
      return quiz({ x: 915, y: 175, w: 605, cls: 'side' }, [
        {
          id: 'u1-cnt-hand',
          prompt: ['数一数豆豆有几只手（hands）？'],
          build: choice(
            [
              [u1_numBadge('1', '#ff9f1c'), '1 只手'],
              [u1_numBadge('2', '#ff5a5f'), '2 只手'],
              [u1_numBadge('3', '#2d7dd2'), '3 只手'],
            ],
            1,
            '答对了！左手和右手加起来，一共有 2 只手！',
            ['再数一数左边和右边，两只手都能拿东西哦！', null, '只有左手和右手，没有 3 只手哦。'],
            () => fillCount(0, 'hand')
          ),
        },
        {
          id: 'u1-cnt-leg',
          prompt: ['数一数豆豆有几条腿（legs）？'],
          build: choice(
            [
              [u1_numBadge('2', '#2d7dd2'), '2 条腿'],
              [u1_numBadge('1', '#ff9f1c'), '1 条腿'],
              [u1_numBadge('3', '#9d4edd'), '3 条腿'],
            ],
            0,
            '真棒！我们有 2 条腿，可以走路和蹦蹦跳！',
            [null, '一条腿站着会摔倒哦，数数左右两条腿！', '小探险家有 2 条腿，不是 3 条哦。'],
            () => fillCount(1, 'leg')
          ),
        },
        {
          id: 'u1-cnt-mouth',
          prompt: ['数一数豆豆有几张嘴（mouth）？'],
          build: choice(
            [
              [u1_numBadge('2', '#2d7dd2'), '2 张嘴'],
              [u1_numBadge('1', '#f77f00'), '1 张嘴'],
              [u1_numBadge('3', '#ff5a5f'), '3 张嘴'],
            ],
            1,
            '太聪明了！我们只有 1 张嘴，用来说话、唱歌和吃东西！',
            ['再照照镜子看一看，脸上只有 1 张嘴巴哦！', null, '只有 1 张嘴巴哦！'],
            () => fillCount(2, 'mouth')
          ),
        },
        {
          id: 'u1-cnt-eye',
          prompt: ['数一数豆豆有几只眼睛（eyes）？'],
          build: choice(
            [
              [u1_numBadge('1', '#f77f00'), '1 只眼睛'],
              [u1_numBadge('3', '#9d4edd'), '3 只眼睛'],
              [u1_numBadge('2', '#2bb673'), '2 只眼睛'],
            ],
            2,
            '全对啦！我有 2 只亮晶晶的眼睛，用来看五彩缤纷的世界！',
            ['左边一只、右边一只，加起来是 2 只眼睛哦！', '没有 3 只眼睛，是左眼和右眼一共 2 只！', null],
            () => fillCount(3, 'eye')
          ),
        },
      ], done, '数数身体部位');
    },
  }],

  /* 8. 身体小侦探通关总结 */
  ['u1_outro', '通关成功 · 身体小侦探！', (m, D) => {
    const p = panel(0);
    u1_bg(p, 'bg_u1_park.jpg', 0.18);
    sfx('u1_outro', 0.15, 'applause', 0.45);
    sfx('u1_outro', 0.25, 'chime', 0.5);

    u1_badge(p, '单元 1 通关 · 身体小侦探！', 84, 62, '#2bb673', 0.1);
    const expWrap = G(p, { x: 330, y: 515 });
    const exp = Doudou.create(expWrap, { x: 0, y: 0, s: 1.54, hat: true, scarf: true, prop: 'badge', propSide: 'R', eyeColor: 'brown', expr: 'happy', armL: 24, armR: -78 });

    const wins = [
      ['o1', '认识身体 10 部位 & 脸部 9 五官', '#ff5a5f', 0, 'dot'],
      ['o2', '早晚用牙刷和牙膏保护牙齿', '#00a8e8', 1, 'star'],
      ['o3', '用眼睛看颜色、大小、形状和红绿灯', '#2d7dd2', 2, 'tri'],
      ['o4', '数一数：2 只手 · 2 条腿 · 1 张嘴 · 2 只眼', '#2bb673', 3, 'sq'],
    ];
    wins.forEach(([mkName, txt, col, idx, icon]) => {
      const card = G(p, { x: 640, y: 205 + idx * 145, o: 0, s: 0.88 });
      mk('rect', { x: 0, y: -48, width: 820, height: 108, rx: 28, fill: 'rgba(255,255,255,0.95)', stroke: col, 'stroke-width': 4 }, card);
      if (icon === 'dot') mk('circle', { cx: 48, cy: 6, r: 16, fill: col }, card);
      else if (icon === 'star') mk('polygon', { points: '48,-12 54,0 66,0 56,8 60,20 48,13 36,20 40,8 30,0 42,0', fill: col }, card);
      else if (icon === 'tri') mk('polygon', { points: '48,-12 32,18 64,18', fill: col }, card);
      else mk('rect', { x: 34, y: -8, width: 28, height: 28, rx: 5, fill: col }, card);
      T(card, txt, { x: 86, y: 16, size: 32, fill: '#2b241d', weight: 700 });
      tw(card, { o: 1, s: 1 }, m(mkName), 0.35, back);
    });

    clockRun(t => {
      put(expWrap, { y: 515 - Math.abs(12 * Math.sin(t * 4)) });
      Doudou.animateIdle(exp, t, { armL: 24, armR: -78 + 14 * Math.sin(t * 6.5) });
    }, D, { tail: true });
  }, { lead: false }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- 欢快儿童背景配乐（人声下自动压低 -16 dB） ---------- */
window.MUSIC_LEVELS = { under: -16, open: -8 };
music('audio/bgm/about_me.mp3', ['u1_intro', 'u1_body', 'u1_face', 'u1_brush', 'u1_eyes', 'u1_traffic', 'u1_count', 'u1_outro'], 0.34);

boot();
</script>
