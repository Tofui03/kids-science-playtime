<script>
'use strict';
const CHAPTER = { number: 6, title: '游戏时间到！It\'s Playtime!', minutes: 4, language: 'zh', film: true, questionKeys: false };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- 绘本舞台助手（sc_ 前缀避免全局冲突） ---------- */
function sc_bg(p, imgName, veil = 0.22) {
  mk('image', { href: `../img/${imgName}`, x: 0, y: 0, width: 1600, height: 900, preserveAspectRatio: 'xMidYMid slice' }, p);
  if (veil > 0) mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: `rgba(255,253,247,${veil})` }, p);
}

const sc_txt = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 700 } = {}) => {
  const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 });
  if (t0 !== null) show(e, t0, 0.35);
  return e;
};

function sc_badge(p, label, x = 80, y = 66, fill = '#ff5a5f', t0 = 0.1) {
  const g = G(p, { x, y, o: 0 });
  const w = Math.max(150, label.length * 26 + 52);
  mk('rect', { x: 4, y: -24, width: w, height: 52, rx: 26, fill: 'rgba(60,40,10,0.14)' }, g);
  mk('rect', { x: 0, y: -28, width: w, height: 52, rx: 26, fill }, g);
  T(g, label, { x: w / 2, y: 7, size: 25, fill: '#ffffff', weight: 700, anchor: 'middle' });
  tw(g, { o: 1 }, t0, 0.3);
  return g;
}

function sc_panelCard(p, x, y, w, h, { fill = 'rgba(255,253,247,0.92)', stroke = '#f0dec0', sw = 4, rx = 28 } = {}) {
  const g = G(p, { x, y });
  mk('rect', { x: 6, y: 10, width: w, height: h, rx, fill: 'rgba(80,50,20,0.1)' }, g);
  mk('rect', { x: 0, y: 0, width: w, height: h, rx, fill, stroke, 'stroke-width': sw }, g);
  return g;
}

/* 题目选项中的彩色圆块 + 互动即时音效 */
function sc_swatch(hex) {
  const sp = h('span', 'sc-swatch');
  sp.style.background = hex;
  if (hex.toLowerCase() === '#ffffff') sp.style.borderColor = '#2b241d';
  return sp;
}

const SC_SFX_CACHE = {};
function sc_playSfx(name, vol = 0.6) {
  try {
    const a = SC_SFX_CACHE[name] || (SC_SFX_CACHE[name] = new Audio(`audio/sfx/${name}.mp3`));
    a.currentTime = 0;
    a.volume = vol * +($('volume')?.value ?? 1);
    a.play().catch(() => {});
  } catch {}
}

/* 可爱眨眼微笑五官（让颜色块和形状都变成活过来的小伙伴） */
function sc_face(p, x, y, { s = 1, light = false } = {}) {
  const fg = light ? '#ffffff' : '#2b241d';
  const g = G(p, { x, y, s });
  const eyeL = mk('circle', { cx: -14, cy: -4, r: 4.8, fill: fg }, g);
  const eyeR = mk('circle', { cx: 14, cy: -4, r: 4.8, fill: fg }, g);
  if (!light) {
    mk('circle', { cx: -12.5, cy: -5.5, r: 1.6, fill: '#ffffff' }, g);
    mk('circle', { cx: 15.5, cy: -5.5, r: 1.6, fill: '#ffffff' }, g);
  }
  mk('ellipse', { cx: -22, cy: 5, rx: 6, ry: 3.5, fill: '#ff8fa3', opacity: light ? 0.5 : 0.7 }, g);
  mk('ellipse', { cx: 22, cy: 5, rx: 6, ry: 3.5, fill: '#ff8fa3', opacity: light ? 0.5 : 0.7 }, g);
  mk('path', { d: 'M-9 8 Q0 17 9 8', fill: 'none', stroke: fg, 'stroke-width': 3, 'stroke-linecap': 'round' }, g);
  return { g, eyeL, eyeR };
}

/* 有机颜料水滴块 */
function sc_blob(p, x, y, fill, { s = 1, stroke = 'none', sw = 0, face = true, lightFace = false } = {}) {
  const g = G(p, { x, y, s });
  mk('path', {
    d: 'M-76 -14 C-86 -48 -38 -64 2 -54 C36 -66 84 -42 78 -8 C90 26 48 60 6 52 C-34 66 -88 38 -76 -14 Z',
    fill, stroke, 'stroke-width': sw,
  }, g);
  mk('ellipse', { cx: -32, cy: -28, rx: 14, ry: 7, transform: 'rotate(-22 -32 -28)', fill: '#ffffff', opacity: 0.35 }, g);
  const fc = face ? sc_face(g, 0, 2, { s: 0.95, light: lightFace }) : null;
  return { g, fc };
}

/* 小探险家豆豆由 ../lib/doudou.js 提供 */

/* 绘制拟人化 3D/2D 形状角色 */
function sc_drawShape(p, kind, x, y, { s = 1, label = '', en = '' } = {}) {
  const g = G(p, { x, y, s });
  let fc = null;
  if (kind === 'cube') {
    mk('polygon', { points: '-52,-32 0,-60 52,-32 0,-4', fill: '#ffe169', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('polygon', { points: '-52,-32 0,-4 0,56 -52,28', fill: '#ffbe0b', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('polygon', { points: '0,-4 52,-32 52,28 0,56', fill: '#f39c12', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, -22, 16, { s: 0.65 });
  } else if (kind === 'cuboid') {
    mk('polygon', { points: '-86,-22 -44,-46 86,-46 44,-22', fill: '#c77dff', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('polygon', { points: '-86,-22 44,-22 44,36 -86,36', fill: '#9d4edd', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('polygon', { points: '44,-22 86,-46 86,12 44,36', fill: '#7b2cbf', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, -20, 8, { s: 0.72, light: true });
  } else if (kind === 'sphere') {
    mk('circle', { cx: 0, cy: 0, r: 54, fill: '#274c9b', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('circle', { cx: -10, cy: -12, r: 42, fill: '#3b6fd8' }, g);
    mk('ellipse', { cx: -22, cy: -26, rx: 14, ry: 8, transform: 'rotate(-28 -22 -26)', fill: '#9cc2ff', opacity: 0.8 }, g);
    fc = sc_face(g, 0, 4, { s: 0.85, light: true });
  } else if (kind === 'pyramid') {
    mk('polygon', { points: '0,-62 -56,42 10,56', fill: '#24b0e6', stroke: '#2b241d', 'stroke-width': 3 }, g);
    mk('polygon', { points: '0,-62 10,56 58,30', fill: '#0b87ba', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, -14, 16, { s: 0.68, light: true });
  } else if (kind === 'square') {
    mk('rect', { x: -50, y: -50, width: 100, height: 100, rx: 10, fill: '#ff70a6', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, 0, 4, { s: 0.88 });
  } else if (kind === 'rectangle') {
    mk('rect', { x: -86, y: -44, width: 172, height: 88, rx: 10, fill: '#8ac926', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, 0, 4, { s: 0.88 });
  } else if (kind === 'circle') {
    mk('circle', { cx: 0, cy: 0, r: 54, fill: '#ff7b29', stroke: '#2b241d', 'stroke-width': 3 }, g);
    fc = sc_face(g, 0, 4, { s: 0.88, light: true });
  } else if (kind === 'triangle') {
    mk('polygon', { points: '0,-56 -60,48 60,48', fill: '#19a7e0', stroke: '#2b241d', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
    fc = sc_face(g, 0, 18, { s: 0.78, light: true });
  }
  if (label) {
    T(g, label, { x: 0, y: 92, size: 28, fill: '#2b241d', weight: 700, anchor: 'middle' });
    if (en) T(g, en, { x: 0, y: 122, size: 22, fill: '#665c50', weight: 600, anchor: 'middle' });
  }
  return { g, fc };
}

/* ---------- 听音找一找形状列表 ---------- */
let sc_shapeThings = [];
const SC_SHAPE_ASKS = [
  { word: '三角形', clip: 'q-triangle', again: 'r-triangle' },
  { word: '圆形', clip: 'q-circle', again: 'r-circle' },
  { word: '正方形', clip: 'q-square', again: 'r-square' },
  { word: '球体', clip: 'q-sphere', again: 'r-sphere' },
  { word: '正方体', clip: 'q-cube', again: 'r-cube' },
];

/* ---------- 节拍时间线 BEATS ---------- */
const BEATS = [
  /* 1. 活泼开场 */
  ['intro', '游戏时间到！It\'s Playtime!', (m, D) => {
    const p = panel(0);
    sc_bg(p, 'bg_playroom.jpg', 0.14);
    sfx('intro', 0.2, 'bell', 0.55);

    sc_badge(p, '趣味科学小课堂', 84, 68, '#ff5a5f', 0.1);
    const titleBox = sc_panelCard(p, 560, 140, 860, 260, { fill: 'rgba(255,255,255,0.92)', stroke: '#ffbe0b', sw: 5, rx: 36 });
    T(titleBox, '游戏时间到！', { x: 430, y: 112, size: 74, fill: '#ff5a5f', weight: 700, anchor: 'middle' });
    T(titleBox, 'It\'s Playtime!', { x: 430, y: 186, size: 42, fill: '#2d7dd2', weight: 700, anchor: 'middle' });
    put(titleBox, { o: 0, s: 0.85 }); tw(titleBox, { o: 1, s: 1 }, 0.25, 0.5, back);

    const expWrap = G(p, { x: 320, y: 575, o: 0 });
    const exp = Doudou.create(expWrap, { x: 0, y: 0, s: 1.52, hat: true, scarf: true, prop: 'magnifier', propSide: 'L', eyeColor: 'brown', expr: 'happy', armL: 28, armR: -120 });
    tw(expWrap, { o: 1, y: 515 }, 0.2, 0.6, out);

    // 四个主题徽章图标随旁白跳出（使用纯 SVG 彩点/图形图标，避免无 emoji 字体时出现方框）
    const tags = [
      ['认识颜色', '#ff5a5f', 660, 515, 0, 'dot'],
      ['混色魔法', '#9d4edd', 920, 515, 0.25, 'star'],
      ['形状朋友', '#19a7e0', 1180, 515, 0.5, 'tri'],
      ['分类与影子', '#2bb673', 920, 660, 0.75, 'sq'],
    ];
    tags.forEach(([txt, col, tx, ty, dt, icon]) => {
      const b = G(p, { x: tx, y: ty, o: 0, s: 0.82 });
      mk('rect', { x: -115, y: -36, width: 230, height: 72, rx: 36, fill: '#ffffff', stroke: col, 'stroke-width': 4 }, b);
      if (icon === 'dot') mk('circle', { cx: -74, cy: 0, r: 12, fill: col }, b);
      else if (icon === 'star') mk('polygon', { points: '-74,-14 -69,-4 -59,-4 -67,3 -64,13 -74,7 -84,13 -81,3 -89,-4 -79,-4', fill: col }, b);
      else if (icon === 'tri') mk('polygon', { points: '-74,-13 -87,11 -61,11', fill: col }, b);
      else mk('rect', { x: -85, y: -11, width: 22, height: 22, rx: 4, fill: col }, b);
      T(b, txt, { x: 14, y: 10, size: 28, fill: col, weight: 700, anchor: 'middle' });
      tw(b, { o: 1, s: 1 }, m('ready', dt), 0.38, back);
    });

    clockRun(t => {
      Doudou.animateIdle(exp, t, { armL: 28, armR: -120 + 18 * Math.sin(t * 6.5) });
    }, D, { tail: true });
  }, { lead: false }],

  /* 2. 九种颜色（会眨眼的颜料水滴宝宝） */
  ['colours', '颜色 Colours', (m, D) => {
    const p = panel(0);
    sc_bg(p, 'bg_playroom.jpg', 0.26);
    sc_badge(p, '颜色 Colours', 84, 64, '#ff5a5f', 0.1);
    const sub = sc_panelCard(p, 510, 36, 910, 56, { fill: 'rgba(255,255,255,0.9)', stroke: '#f0dec0', sw: 2.5, rx: 28 });
    T(sub, '这里有不同的颜色 · There are different colours.', { x: 455, y: 37, size: 27, fill: '#2b241d', weight: 700, anchor: 'middle' });
    put(sub, { o: 0 }); show(sub, 0.2, 0.35);

    const palette = [
      ['c_red', '红色', 'red', '#e63946', '#2b241d', true],
      ['c_yellow', '黄色', 'yellow', '#ffd60a', '#2b241d', false],
      ['c_green', '绿色', 'green', '#57cc3a', '#2b241d', false],
      ['c_brown', '褐色', 'brown', '#a0522d', '#2b241d', true],
      ['c_orange', '橙色', 'orange', '#ff851b', '#2b241d', false],
      ['c_blue', '蓝色', 'blue', '#00a8e8', '#2b241d', true],
      ['c_purple', '紫色', 'purple', '#7b2cbf', '#2b241d', true],
      ['c_white', '白色', 'white', '#ffffff', '#2b241d', false],
      ['c_black', '黑色', 'black', '#2b2b2b', '#2b241d', true],
    ];

    const blobs = [];
    palette.forEach(([mkName, zh, en, hex, border, lightFace], i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const x = 350 + col * 450, y = 232 + row * 224;
      const card = G(p, { x, y, o: 0, s: 0.78 });
      mk('rect', { x: -175, y: -88, width: 350, height: 186, rx: 24, fill: 'rgba(255,255,255,0.92)', stroke: '#f0dec0', 'stroke-width': 3 }, card);
      const b = sc_blob(card, -68, 6, hex, {
        s: 0.92,
        stroke: hex === '#ffffff' ? '#2b241d' : 'none',
        sw: hex === '#ffffff' ? 3 : 0,
        lightFace,
      });
      T(card, zh, { x: 84, y: -4, size: 42, fill: '#2b241d', weight: 700, anchor: 'middle' });
      T(card, en, { x: 84, y: 42, size: 30, fill: '#665c50', weight: 600, anchor: 'middle' });
      const tAt = m(mkName);
      tw(card, { o: 1, s: 1 }, tAt, 0.36, back);
      sfx('colours', tAt, 'pop', 0.45);
      blobs.push({ b, phase: i * 0.7 });
    });

    clockRun(t => {
      blobs.forEach(({ b, phase }) => {
        if (b.fc) {
          const blink = ((t + phase) % 3.6 > 3.45) ? 0.15 : 1;
          put(b.fc.eyeL, { s: blink });
          put(b.fc.eyeR, { s: blink });
          put(b.g, { r: 3 * Math.sin(t * 2.5 + phase) });
        }
      });
    }, D, { tail: true });
  }, { lead: false }],

  /* 3. 混色魔法动态演示 */
  ['mixing_demo', '颜色的混合 Mixing colours', (m, D) => {
    const p = panel(0);
    sc_bg(p, 'bg_magic_lab.jpg', 0.22);
    sc_badge(p, '混色魔法 Mixing colours', 84, 64, '#9d4edd', 0.1);
    sc_txt(p, '我们可以将两种颜色混合起来，得到新的颜色。', 800, 108, 0.2, { size: 30, fill: '#2b241d', anchor: 'middle' });
    sc_txt(p, 'We can mix two colours to get a new colour.', 800, 146, 0.35, { size: 24, fill: '#665c50', anchor: 'middle' });

    const rows = [
      ['mix1', 'res1', 310, '#00a8e8', '蓝色 blue', '#e63946', '红色 red', '#7b2cbf', '紫色 purple'],
      ['mix2', 'res2', 620, '#ffd60a', '黄色 yellow', '#00a8e8', '蓝色 blue', '#57cc3a', '绿色 green'],
    ];

    rows.forEach(([mkMix, mkRes, ry, c1, l1, c2, l2, c3, l3]) => {
      const box = sc_panelCard(p, 150, ry - 115, 1300, 245, { fill: 'rgba(255,253,247,0.9)', stroke: '#e8d5f5', sw: 4 });
      const b1 = sc_blob(p, 350, ry, c1, { s: 1.05, lightFace: true });
      const b2 = sc_blob(p, 720, ry, c2, { s: 1.05, lightFace: c2 !== '#ffd60a' });
      const b3 = sc_blob(p, 1210, ry, c3, { s: 1.15, lightFace: c3 !== '#57cc3a' });

      put(b1.g, { o: 0, s: 0.7 }); tw(b1.g, { o: 1, s: 1 }, m(mkMix), 0.35, back);
      put(b2.g, { o: 0, s: 0.7 }); tw(b2.g, { o: 1, s: 1 }, m(mkMix, 0.7), 0.35, back);

      const plus = sc_txt(p, '+', 535, ry + 18, m(mkMix, 0.5), { size: 64, fill: '#2b241d', anchor: 'middle' });
      const eq = sc_txt(p, '=', 955, ry + 18, m(mkRes, -0.3), { size: 64, fill: '#2b241d', anchor: 'middle' });
      sc_txt(p, l1, 350, ry + 96, m(mkMix), { size: 26, fill: '#2b241d', anchor: 'middle' });
      sc_txt(p, l2, 720, ry + 96, m(mkMix, 0.7), { size: 26, fill: '#2b241d', anchor: 'middle' });

      // 魔法混合闪烁光环 + 结果弹出
      const magic = G(p, { x: 1210, y: ry, o: 0, s: 0.4 });
      mk('circle', { cx: 0, cy: 0, r: 96, fill: 'none', stroke: '#ffd60a', 'stroke-width': 6, 'stroke-dasharray': '14 10' }, magic);
      tw(magic, { o: 1, s: 1.15, r: 90 }, m(mkRes, -0.35), 0.55, out);
      tw(magic, { o: 0, s: 1.4 }, m(mkRes, 0.45), 0.4);

      put(b3.g, { o: 0, s: 0.3 });
      tw(b3.g, { o: 1, s: 1.15 }, m(mkRes), 0.45, back);
      sc_txt(p, l3, 1210, ry + 96, m(mkRes, 0.2), { size: 30, fill: c3, anchor: 'middle' });
      sfx('mixing_demo', m(mkRes), 'chime', 0.55);
      void box; void plus; void eq;
    });
  }, { lead: false }],

  /* 4. 混色猜一猜互动题（选项带彩色圆块，答对左边立即变出笑脸颜料结果） */
  ['mixing_quiz', '混色猜一猜 Mixing Challenge', (m) => {
    const p = panel(0);
    sc_bg(p, 'bg_magic_lab.jpg', 0.22);
    sc_badge(p, '小小色彩魔法师', 84, 64, '#ff5a5f', 0.1);
    sc_txt(p, '混合在一起，会得到什么颜色？', 100, 148, 0.2, { size: 30, fill: '#2b241d' });

    const puzzles = [
      ['#e63946', '红色 red', '#ffd60a', '黄色 yellow', '#ff851b', '橙色 orange', false],
      ['#2b2b2b', '黑色 black', '#ffffff', '白色 white', '#9e9e9e', '灰色 grey', true],
      ['#e63946', '红色 red', '#ffffff', '白色 white', '#ff9ebb', '粉红色 pink', false],
    ];

    S.mixRows = [];
    puzzles.forEach(([c1, n1, c2, n2, cres, ansName, lightAns], i) => {
      const py = 260 + i * 195;
      const card = sc_panelCard(p, 90, py - 78, 690, 165, { fill: 'rgba(255,253,247,0.93)', stroke: '#e6d4b8', sw: 3, rx: 24 });
      sc_blob(card, 110, 72, c1, { s: 0.6, lightFace: c1 !== '#ffffff' });
      T(card, n1, { x: 110, y: 140, size: 22, fill: '#2b241d', weight: 700, anchor: 'middle' });
      T(card, '+', { x: 225, y: 84, size: 44, fill: '#2b241d', weight: 700, anchor: 'middle' });
      sc_blob(card, 340, 72, c2, { s: 0.6, stroke: c2 === '#ffffff' ? '#2b241d' : 'none', sw: c2 === '#ffffff' ? 2.5 : 0, lightFace: false });
      T(card, n2, { x: 340, y: 140, size: 22, fill: '#2b241d', weight: 700, anchor: 'middle' });
      T(card, '=', { x: 460, y: 84, size: 44, fill: '#2b241d', weight: 700, anchor: 'middle' });

      // 问号占位（用中性蓝色虚线，不提前剧透答案颜色）
      const qCircle = mk('circle', { cx: 580, cy: 76, r: 48, fill: '#f7f1e3', stroke: '#2d7dd2', 'stroke-width': 4, 'stroke-dasharray': '8 6' }, card);
      const qText = T(card, '?', { x: 580, y: 92, size: 48, fill: '#2d7dd2', weight: 700, anchor: 'middle' });

      // 隐藏的结果笑脸颜料块，答对时弹出
      const ansWrap = G(card, { x: 580, y: 72, o: 0, s: 0.4 });
      sc_blob(ansWrap, 0, 0, cres, { s: 0.64, lightFace: lightAns });
      const ansLbl = T(card, ansName, { x: 580, y: 140, size: 22, fill: '#2b241d', weight: 700, anchor: 'middle', o: 0 });
      S.mixRows.push({ qCircle, qText, ansWrap, ansLbl });

      put(card, { o: 0, y: py - 60 });
      tw(card, { o: 1, y: py - 78 }, m('mq', i * 0.45), 0.4, out);
    });
  }, {
    lead: false,
    hold: 1.8,
    ask: done => {
      const revealMix = idx => {
        const row = S.mixRows?.[idx];
        if (!row) return;
        fx(row.qCircle, { o: 0 }, 0, 0.2);
        fx(row.qText, { o: 0 }, 0, 0.2);
        fx(row.ansWrap, { o: 1, s: 1 }, 0.05, 0.35, back);
        fx(row.ansLbl, { o: 1 }, 0.12, 0.25);
        sc_playSfx('chime', 0.6);
      };
      return quiz({ x: 830, y: 155, w: 680, cls: 'side' }, [
        {
          id: 'c-mix-ry',
          prompt: ['魔法 1：', sc_swatch('#e63946'), '红色 + ', sc_swatch('#ffd60a'), '黄色 = ？'],
          build: choice(
            [
              [sc_swatch('#ff851b'), '橙色 orange'],
              [sc_swatch('#57cc3a'), '绿色 green'],
              [sc_swatch('#00a8e8'), '蓝色 blue'],
            ],
            0,
            '答对了！红色加黄色会变成像橘子一样的橙色（orange）！',
            [null, '绿色是黄色和蓝色变出来的哦！', '蓝色是原本就有的颜色，红+黄会变暖色调的橙色。'],
            () => revealMix(0)
          ),
        },

          const openKeys = item.targets.filter(k => !SLOTS[k].filled);
          if (!openKeys.length) {
            fx(item.g, { x: item.home[0], y: item.home[1] }, 0, 0.25, out);
            return;
          }
          openKeys.sort((a, b) => Math.hypot(x - SLOTS[a].x, y - SLOTS[a].y) - Math.hypot(x - SLOTS[b].x, y - SLOTS[b].y));
          snapToSlot(item, openKeys[0]);
        };

        pieceDefs.forEach((def, idx) => {
          const g = G(L, { x: def.home[0], y: def.home[1] });
          g.classList.add('sc-drag');
          g.setAttribute('tabindex', '0');
          g.setAttribute('role', 'button');
          g.setAttribute('aria-label', def.label);
          def.draw(g);
          const lbl = T(g, def.label, { x: 0, y: def.lblY, size: 22, fill: def.lblCol, weight: 700, anchor: 'middle' });
          const item = { ...def, g, lbl, placed: null };
          nodes.push(item);

          let drag = null;
          g.addEventListener('pointerdown', e => {
            if (locked || item.placed) return;
            e.preventDefault();
            const p0 = pt(e);
            drag = { dx: p0[0] - st(g).x, dy: p0[1] - st(g).y, sx: p0[0], sy: p0[1], moved: false };
            L.append(g); // 先提升层级再捕获指针
            g.setPointerCapture(e.pointerId);
          });
          g.addEventListener('pointermove', e => {
            if (!drag) return;
            const p0 = pt(e);
            if (Math.hypot(p0[0] - drag.sx, p0[1] - drag.sy) > 8) drag.moved = true;
            if (drag.moved) put(g, { x: p0[0] - drag.dx, y: p0[1] - drag.dy });
          });
          const endDrag = () => {
            if (!drag) return;
            const wasMoved = drag.moved;
            drag = null;
            if (wasMoved) tryPlace(item, st(g).x, st(g).y, false);
            else tryPlace(item, st(g).x, st(g).y, true);
          };
          g.addEventListener('pointerup', endDrag);
          g.addEventListener('lostpointercapture', endDrag);
          keyAct(g, () => tryPlace(item, def.home[0], def.home[1], true));
        });

        return {
          hint: [kbd('1–5'), ' 放置积木 · 或直接拖进黑影'],
          reveal() {
            nodes.forEach(item => {
              if (!item.placed && item.targets.length) {
                const openKey = item.targets.find(k => !SLOTS[k].filled);
                if (openKey) snapToSlot(item, openKey);
              }
            });
            return '紫色三角形 + 橙色长方形 + 两个黄色圆形组成小屋子车！';
          },
          lock() { locked = true; nodes.forEach(n => { n.g.style.cursor = 'default'; }); },
          key(e) {
            const idx = +e.key - 1;
            if (idx >= 0 && idx < nodes.length) {
              const it = nodes[idx];
              tryPlace(it, it.home[0], it.home[1], true);
              return true;
            }
            return false;
          },
        };
      },
    }], done, 'HOTS 影子拼图'),
  }],

  /* 9. 通关庆祝结尾 */
  ['outro', '通关成功！', (m, D) => {
    const p = panel(0);
    sc_bg(p, 'bg_playroom.jpg', 0.2);
    sfx('outro', 0.15, 'applause', 0.45);
    sfx('outro', 0.2, 'chime', 0.5);

    sc_badge(p, '通关成功 · 小科学家真棒！', 84, 64, '#2bb673', 0.1);
    const expWrap = G(p, { x: 330, y: 515 });
    const exp = Doudou.create(expWrap, { x: 0, y: 0, s: 1.5, hat: true, scarf: true, prop: 'badge', propSide: 'R', eyeColor: 'brown', expr: 'happy', armL: 24, armR: -78 });

    const wins = [
      ['o1', '认识九种颜色（中英双语）', '#ff5a5f', 0, 'dot'],
      ['o2', '蓝+红=紫 · 黄+蓝=绿', '#9d4edd', 1, 'star'],
      ['o3', '分辨 3D 立体与 2D 平面形状', '#19a7e0', 2, 'tri'],
      ['o4', '按颜色与形状分类 · 影子拼图', '#2bb673', 3, 'sq'],
    ];
    wins.forEach(([mkName, txt, col, idx, icon]) => {
      const card = G(p, { x: 640, y: 205 + idx * 145, o: 0, s: 0.88 });
      mk('rect', { x: 0, y: -48, width: 780, height: 108, rx: 28, fill: 'rgba(255,255,255,0.95)', stroke: col, 'stroke-width': 4 }, card);
      if (icon === 'dot') mk('circle', { cx: 48, cy: 6, r: 16, fill: col }, card);
      else if (icon === 'star') mk('polygon', { points: '48,-12 54,0 66,0 56,8 60,20 48,13 36,20 40,8 30,0 42,0', fill: col }, card);
      else if (icon === 'tri') mk('polygon', { points: '48,-12 32,18 64,18', fill: col }, card);
      else mk('rect', { x: 34, y: -8, width: 28, height: 28, rx: 5, fill: col }, card);
      T(card, txt, { x: 86, y: 16, size: 34, fill: '#2b241d', weight: 700 });
      tw(card, { o: 1, s: 1 }, m(mkName), 0.35, back);
    });

    clockRun(t => {
      put(expWrap, { y: 515 - Math.abs(12 * Math.sin(t * 4)) });
      Doudou.animateIdle(exp, t, { armL: 24, armR: -78 + 14 * Math.sin(t * 6.5) });
    }, D, { tail: true });
  }, { lead: false }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- 欢快儿童背景配乐（人声下自动压低 -16 dB） ---------- */
window.MUSIC_LEVELS = { under: -16, open: -8 };
music('audio/bgm/playtime.mp3', ['intro', 'colours', 'mixing_demo', 'mixing_quiz', 'shapes', 'shape_find', 'grouping', 'hots_shadow', 'outro'], 0.34);

boot();
</script>
